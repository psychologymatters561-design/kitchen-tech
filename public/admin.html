<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders and leads · Kitchen Tech admin</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body { background: var(--atta); }
  .adm { width: min(100% - 32px, 1400px); margin: 0 auto; padding: 28px 0 80px; }
  .adm header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 24px; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { border: 1px solid rgba(27,21,17,.15); background: #fffdf9; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  .tabs button[aria-selected=true] { background: var(--ink); color: var(--atta); }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 20px; }
  .kpi { background: #fffdf9; border: 1px solid rgba(27,21,17,.08); border-radius: 16px; padding: 16px 18px; }
  .kpi b { display: block; font-family: var(--font-display); font-size: 2rem; font-weight: 400; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--smoke); font-size: .85rem; }
  .tbl { overflow-x: auto; background: #fffdf9; border-radius: 16px; border: 1px solid rgba(27,21,17,.08); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 900px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(27,21,17,.07); vertical-align: top; }
  th { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--smoke); position: sticky; top: 0; background: #fffdf9; }
  td small { color: var(--smoke); }
  select.st { padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(27,21,17,.2); font: inherit; }
  .login { max-width: 420px; margin: 18vh auto; }
</style>
</head>
<body>
<div class="adm">
  <form class="login form form-card card" id="login">
    <h1 class="h3">Kitchen Tech admin</h1>
    <div class="field"><label for="tok">Admin token</label><input class="input" id="tok" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-dark" type="submit">Open</button>
    <p class="form-note" id="login-err"></p>
  </form>
  <div id="app" hidden>
    <header>
      <h1 class="h2" style="font-size:2rem">Orders and leads</h1>
      <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="orders">Orders</button><button role="tab" aria-selected="false" data-tab="leads">Leads</button></div>
      <div class="btn-row"><button class="btn btn-sm btn-ghost" id="csv" type="button">Download CSV</button><button class="btn btn-sm btn-ghost" id="refresh" type="button">Refresh</button><button class="btn btn-sm btn-ghost" id="logout" type="button">Log out</button></div>
    </header>
    <div class="kpis" id="kpis"></div>
    <div class="tbl"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
</div>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
