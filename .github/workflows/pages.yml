name: Deploy website to GitHub Pages

# Builds on every push to main and the original branch (kept in sync).
# Publishes only from the repo's default branch, and only when
# Settings -> Pages -> Source is "GitHub Actions". Until then the build still
# runs (tests + photos) and the branch-mode Pages site keeps serving.
on:
  push:
    branches: [main, claude/gifted-noether-mo8yw5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static site (downloads product photos, converts to WebP)
        run: node scripts/build-static.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          STAGING: ${{ vars.STAGING || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: mode
        name: Can this run publish?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          if [ "$type" = "workflow" ] && [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Built but not published. Pages source is '$type' (needs 'workflow' = GitHub Actions) and this branch is '${{ github.ref_name }}' (publishes from '${{ github.event.repository.default_branch }}')."
          fi

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
